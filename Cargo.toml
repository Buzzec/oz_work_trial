[workspace]
resolver = "3"
exclude = ["zama"]
members = [
    "programs/*"
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
anchor-lang = "1.2.0"
bytemuck = "1.25.2"
confidential-token = { path = "zama/solana/programs/confidential-token" }
derive_more = { version = "2.1.1", features = ["full"] }
linked_list_allocator = { version = "0.10.5", default-features = false }
mollusk-svm = { version = "0.12.1-agave-4.0", features = ["inner-instructions", "precompiles"] }
solana-sdk = "3.0.0"
zama-fhe = { path = "zama/solana/crates/zama-fhe", version = "0.1.0" }
zama-host = { path = "zama/solana/programs/zama-host", version = "0.1.0" }
zama-solana-acl = { path = "zama/solana/crates/zama-solana-acl" }
zama-solana-test-kit = { path = "zama/solana/test-kit" }
