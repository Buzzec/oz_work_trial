[package]
name = "confidential_rfq"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "confidential_rfq"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "zama-host/idl-build"]

[dependencies]
anchor-lang.workspace = true
zama-fhe = { workspace = true, features = ["cpi"] }
zama-host = { workspace = true, features = ["cpi"] }
bytemuck.workspace = true

[dev-dependencies]
mollusk-svm = { version = "0.12.1-agave-4.0", features = ["inner-instructions", "precompiles"] }
solana-sdk = "3.0.0"
zama-solana-test-kit = { path = "../../zama/solana/test-kit" }
