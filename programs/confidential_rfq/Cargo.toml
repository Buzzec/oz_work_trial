[package]
name = "confidential_rfq"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "confidential_rfq"

[features]
default = ["custom-heap"]
custom-heap = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "confidential-token/idl-build", "zama-host/idl-build"]

[dependencies]
anchor-lang.workspace = true
bytemuck.workspace = true
confidential-token = { path = "../../zama/solana/programs/confidential-token", features = ["cpi"] }
derive_more.workspace = true
linked_list_allocator = { version = "0.10.5", default-features = false }
zama-fhe = { workspace = true, features = ["cpi"] }
zama-host = { workspace = true, features = ["cpi"] }

[dev-dependencies]
mollusk-svm = { version = "0.12.1-agave-4.0", features = ["inner-instructions", "precompiles"] }
solana-sdk = "3.0.0"
zama-solana-test-kit = { path = "../../zama/solana/test-kit" }
zama-solana-acl = { path = "../../zama/solana/crates/zama-solana-acl" }
