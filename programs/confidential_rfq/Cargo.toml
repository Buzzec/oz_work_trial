[package]
name = "confidential_rfq"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "confidential_rfq"

[features]
default = ["custom-heap"]
custom-heap = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "confidential-token/idl-build", "zama-host/idl-build"]

[dependencies]
anchor-lang.workspace = true
bytemuck.workspace = true
confidential-token = { workspace = true, features = ["cpi"] }
derive_more.workspace = true
linked_list_allocator.workspace = true
zama-fhe = { workspace = true, features = ["cpi"] }
zama-host = { workspace = true, features = ["cpi"] }
zama-solana-acl.workspace = true

[dev-dependencies]
mollusk-svm.workspace = true
solana-sdk.workspace = true
zama-solana-test-kit.workspace = true
